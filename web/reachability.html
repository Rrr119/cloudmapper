<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>CloudMapper &middot; Reachability paths</title>
    <script src="./js/cytoscape.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111c33;
            --panel-2: #182544;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --critical: #ef4444;
            --high: #f97316;
            --medium: #eab308;
            --low: #22c55e;
            --border: #243355;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 10px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        header h1 { font-size: 16px; margin: 0; font-weight: 650; }
        header a { color: var(--accent); text-decoration: none; font-size: 13px; }
        select, input[type=file] {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px;
        }
        button {
            background: var(--accent);
            color: #082f49;
            border: 0;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 650;
            font-size: 13px;
            cursor: pointer;
        }
        button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
        #status { color: var(--muted); font-size: 12px; }
        main { flex: 1; display: flex; min-height: 0; }
        #sidebar {
            width: 380px;
            min-width: 320px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 12px;
        }
        #cy { flex: 1; min-width: 0; background:
            radial-gradient(circle at 1px 1px, #1b294a 1px, transparent 0) 0 0/22px 22px; }
        .summary { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
        .summary b { color: var(--text); }
        .path-card {
            border: 1px solid var(--border);
            border-left-width: 4px;
            border-radius: 8px;
            background: var(--panel-2);
            padding: 9px 11px;
            margin-bottom: 9px;
            cursor: pointer;
            transition: border-color .12s, transform .05s;
        }
        .path-card:hover { border-color: var(--accent); }
        .path-card.active { outline: 2px solid var(--accent); }
        .path-title { font-size: 12.5px; font-weight: 650; margin-bottom: 5px; display: flex; justify-content: space-between; gap: 8px; }
        .chain { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.55; word-break: break-word; }
        .ports { color: var(--muted); font-size: 11px; margin-top: 5px; }
        .badge { font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
        .badge.critical { background: rgba(239,68,68,.18); color: #fca5a5; }
        .badge.high { background: rgba(249,115,22,.18); color: #fdba74; }
        .badge.medium { background: rgba(234,179,8,.18); color: #fde047; }
        .badge.low, .badge.review { background: rgba(34,197,94,.16); color: #86efac; }
        #details {
            margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px;
            font-size: 12px; color: var(--muted); line-height: 1.6;
        }
        #details code { color: var(--text); }
        .hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
        .loader { display: none; }
    </style>
</head>
<body>
<header>
    <h1>CloudMapper Reachability</h1>
    <a href="./index.html">&larr; topology map</a>
    <select id="accountSelect" title="Account"></select>
    <button id="showAll" class="secondary">Show all paths</button>
    <label class="secondary" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:pointer;">
        Open graph.json
        <input id="graphFile" type="file" accept=".json,application/json" style="display:none"/>
    </label>
    <label class="secondary" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:pointer;">
        Open reachability.json
        <input id="reportFile" type="file" accept=".json,application/json" style="display:none"/>
    </label>
    <span id="status">Loading&hellip;</span>
</header>
<main>
    <aside id="sidebar">
        <div id="summary" class="summary"></div>
        <div id="paths"></div>
        <div id="details">Click a path or node to inspect the security-group evidence.</div>
        <div class="hint">
            Generate data with:<br/>
            <code>python cloudmapper.py reachability --graph web/data.json \<br/>
            &nbsp;&nbsp;--web-overlay web/reachability.json</code>
        </div>
    </aside>
    <div id="cy"></div>
</main>
<script src="./js/reachability-view.js"></script>
</body>
</html>
